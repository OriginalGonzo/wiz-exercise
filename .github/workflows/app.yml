name: Build & Deploy App

on:
  push:
    branches: [main]
    paths: ['app/**', 'helm/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.lowercase.outputs.image_tag }}
      image_repo: ${{ steps.lowercase.outputs.image_repo }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wiz-exercise-app
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Compute lowercase image reference
        id: lowercase
        run: |
          echo "image_repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/wiz-exercise-app" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name wiz-exercise-cluster --region ${{ secrets.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Create GHCR Pull Secret
        run: |
          kubectl create namespace wizapp --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --namespace=wizapp \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install wizapp ./helm/wizapp \
            --namespace wizapp \
            --set image.tag=${{ needs.build.outputs.image_tag }} \
            --set image.repository=${{ needs.build.outputs.image_repo }} \
            --set db.uri="${{ secrets.MONGODB_URI }}" \
            --set backup.bucket=${{ secrets.BACKUP_BUCKET }} \
            --set backup.awsRegion=${{ secrets.AWS_REGION }} \
            --set backup.irsaRoleArn=${{ secrets.BACKUP_IRSA_ROLE_ARN }} \
            --wait --timeout 5m